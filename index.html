<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>民生書院小學 (MSCPS) P1 家長情報站</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary-light: #1e293b;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Lock Screen Modal */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .lock-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      text-align: center;
      transition: transform 0.2s;
    }

    .lock-card.shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .school-emblem {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fef3c7;
      border: 2px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .lock-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .lock-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .btn {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--border);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .lock-error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 10px;
      min-height: 18px;
      display: none;
    }

    /* Main App Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 24px;
      line-height: 1;
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-weight: 500;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Search & Filter Bar */
    .controls-bar {
      max-width: 1200px;
      margin: 16px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      background: var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Layout Container */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      width: 100%;
    }

    /* Section Styling */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-subtitle {
      font-size: 13px;
      font-weight: normal;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* Action Board Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .action-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }

    .action-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-urgent {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .badge-medium {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .badge-group {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .card-date {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
      color: var(--text);
    }

    .card-summary {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .card-attachment {
      margin-bottom: 14px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      max-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .card-attachment img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      transition: opacity 0.2s;
    }

    .card-attachment img:hover {
      opacity: 0.9;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* Topic List */
    .topics-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .topic-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topic-title {
      font-size: 15px;
      font-weight: 700;
    }

    .topic-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .topic-bullets {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 4px;
    }

    .topic-bullets li {
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .topic-bullets li::before {
      content: "•";
      color: var(--primary);
      font-weight: bold;
    }

    /* Noise Accordion */
    .noise-accordion {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 40px;
    }

    .noise-summary-btn {
      width: 100%;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .noise-summary-btn:hover {
      background: var(--primary-light);
    }

    .noise-content {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: none;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Transcript Slide-out Drawer */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: none;
    }

    #transcript-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      box-shadow: var(--shadow-lg);
      z-index: 1001;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    #transcript-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 700;
    }

    .drawer-close {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 4px;
    }

    .drawer-close:hover {
      color: var(--text);
    }

    .drawer-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-bubble {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .bubble-sender {
      font-weight: 700;
      color: var(--primary);
    }

    .bubble-time {
      color: var(--text-muted);
    }

    .bubble-text {
      font-size: 13.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-media {
      margin-top: 6px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bubble-media img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Media Full View Modal */
    #media-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #media-modal img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--card-bg);
    }
  </style>
</head>
<body>

  <!-- Unlock Screen -->
  <div id="lock-screen">
    <div class="lock-card" id="lock-card">
      <div class="school-emblem">🏫</div>
      <h2 class="lock-title">MSCPS P1 家長情報站</h2>
      <p class="lock-subtitle">民生書院小學 (26-27) 私人專屬儀表板</p>
      <form id="unlock-form" onsubmit="handleUnlock(event)">
        <div class="input-group">
          <input type="password" id="portal-password" class="input-field" placeholder="請輸入存取密碼..." autocomplete="current-password" autofocus required>
          <button type="submit" id="unlock-btn" class="btn btn-primary">解鎖情報站 🔓</button>
        </div>
        <div id="lock-error" class="lock-error">密碼不正確，請再試一次。</div>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="brand">
        <span class="brand-icon">🏫</span>
        <div class="brand-text">
          <h1>民生書院小學 (MSCPS) P1 家長情報站</h1>
          <p>小一 A 班 (P1A) & P1 大家庭 實時彙整</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="sync-badge">
          <span class="sync-dot"></span>
          <span id="sync-status">載入中...</span>
        </div>
        <button class="btn btn-outline btn-sm" onclick="lockSession()">🔒 鎖定</button>
      </div>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-box" class="search-input" placeholder="搜尋通告、功課、便服日、考試範圍..." oninput="handleSearch(this.value)">
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">全部情報</button>
      <button class="tab-btn" data-tab="p1a" onclick="switchTab('p1a')">小一 A 班 (P1A)</button>
      <button class="tab-btn" data-tab="p1_family" onclick="switchTab('p1_family')">P1 大家庭</button>
    </div>
  </div>

  <!-- Main Content -->
  <main>
    <!-- Action Items Section -->
    <section>
      <h2 class="section-title">
        📌 重點通告 & 待辦事項
        <span class="section-subtitle" id="action-count">(0 項)</span>
      </h2>
      <div class="action-grid" id="action-board">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Topics Section -->
    <section>
      <h2 class="section-title">
        💬 群組專題討論彙整
        <span class="section-subtitle">點擊查看原始對話</span>
      </h2>
      <div class="topics-container" id="topics-board">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Noise Filter Accordion -->
    <div class="noise-accordion">
      <button class="noise-summary-btn" onclick="toggleNoiseAccordion()">
        <span id="noise-title">🧹 已自動過濾閒聊與覆機訊息</span>
        <span id="noise-chevron">▼</span>
      </button>
      <div class="noise-content" id="noise-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Slide-out Conversation Drawer -->
  <div id="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside id="transcript-drawer">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-title">相關原始對話</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <!-- Rendered dynamically -->
    </div>
  </aside>

  <!-- High-Res Media Modal -->
  <div id="media-modal" onclick="closeMediaModal()">
    <img id="modal-img" src="" alt="Attachment Preview">
  </div>

  <!-- Footer -->
  <footer>
    民生書院小學 (MSCPS) 2026-2027 小一家長群組情報站 · 具端對端加密與離線安全保護
  </footer>

  <!-- Encrypted Data Container -->
  <script id="encrypted-vault" type="application/json">
    {

  <!-- Application Logic & Decryption -->
  <script>
    let PORTAL_DATA = null;
    let ACTIVE_TAB = 'all';
    let SEARCH_QUERY = '';

    // Web Crypto Decryption
    async function deriveKey(password, saltBuffer) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBuffer,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    function base64ToBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function decryptVault(password) {
      const vaultEl = document.getElementById("encrypted-vault");
      if (!vaultEl) throw new Error("Vault container missing");
      const vault = JSON.parse(vaultEl.textContent);

      const saltBuffer = base64ToBuffer(vault.salt);
      const ivBuffer = base64ToBuffer(vault.iv);
      const ciphertextBuffer = base64ToBuffer(vault.ciphertext);

      const key = await deriveKey(password, saltBuffer);
      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: ivBuffer },
        key,
        ciphertextBuffer
      );

      const decoded = new TextDecoder().decode(decrypted);
      return JSON.parse(decoded);
    }

    async function handleUnlock(e) {
      if (e) e.preventDefault();
      const pwdInput = document.getElementById("portal-password");
      const btn = document.getElementById("unlock-btn");
      const err = document.getElementById("lock-error");
      const card = document.getElementById("lock-card");
      const password = pwdInput.value.trim();

      if (!password) return;

      btn.disabled = true;
      btn.textContent = "正在安全解密...";
      err.style.display = "none";
      card.classList.remove("shake");

      try {
        const data = await decryptVault(password);
        PORTAL_DATA = data;
        sessionStorage.setItem("mscps_portal_pwd", password);
        document.getElementById("lock-screen").style.display = "none";
        initPortalUI();
      } catch (error) {
        console.error("Decryption error:", error);
        err.style.display = "block";
        card.classList.add("shake");
        btn.disabled = false;
        btn.textContent = "解鎖情報站 🔓";
        pwdInput.focus();
      }
    }

    function lockSession() {
      sessionStorage.removeItem("mscps_portal_pwd");
      PORTAL_DATA = null;
      document.getElementById("portal-password").value = "";
      document.getElementById("lock-error").style.display = "none";
      document.getElementById("unlock-btn").disabled = false;
      document.getElementById("unlock-btn").textContent = "解鎖情報站 🔓";
      document.getElementById("lock-screen").style.display = "flex";
      document.getElementById("portal-password").focus();
    }

    // Auto-unlock from session
    window.addEventListener("DOMContentLoaded", async () => {
      const savedPwd = sessionStorage.getItem("mscps_portal_pwd");
      if (savedPwd) {
        try {
          const data = await decryptVault(savedPwd);
          PORTAL_DATA = data;
          document.getElementById("lock-screen").style.display = "none";
          initPortalUI();
          return;
        } catch (e) {
          sessionStorage.removeItem("mscps_portal_pwd");
        }
      }
      document.getElementById("portal-password").focus();
    });

    // UI Rendering
    function initPortalUI() {
      if (!PORTAL_DATA) return;

      // Update sync status
      const meta = PORTAL_DATA.meta || {};
      if (meta.generated_at) {
        const genDate = new Date(meta.generated_at);
        document.getElementById("sync-status").textContent = `● 已同步 (${genDate.toLocaleDateString('zh-HK')} ${genDate.toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'})})`;
      }

      renderActionBoard();
      renderTopics();
      renderNoiseSummary();
    }

    function switchTab(tab) {
      ACTIVE_TAB = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      renderActionBoard();
      renderTopics();
      renderNoiseSummary();
    }

    function handleSearch(val) {
      SEARCH_QUERY = val.trim().toLowerCase();
      renderActionBoard();
      renderTopics();
    }

    function renderActionBoard() {
      const board = document.getElementById("action-board");
      if (!PORTAL_DATA || !PORTAL_DATA.action_board) return;

      let items = PORTAL_DATA.action_board;
      if (ACTIVE_TAB !== 'all') {
        items = items.filter(item => item.group === ACTIVE_TAB);
      }

      if (SEARCH_QUERY) {
        items = items.filter(item =>
          item.title.toLowerCase().includes(SEARCH_QUERY) ||
          item.summary.toLowerCase().includes(SEARCH_QUERY)
        );
      }

      document.getElementById("action-count").textContent = `(${items.length} 項)`;

      if (items.length === 0) {
        board.innerHTML = `<div style="grid-column: 1/-1; padding: 32px; text-align: center; color: var(--text-muted); background: var(--card-bg); border-radius: 12px; border: 1px dashed var(--border);">沒有符合篩選條件的重點通告。</div>`;
        return;
      }

      board.innerHTML = items.map(item => {
        const isUrgent = item.urgency === 'high';
        const badgeClass = isUrgent ? 'badge-urgent' : 'badge-medium';
        const badgeText = isUrgent ? '重要/急件' : '日常通知';
        const groupBadge = item.group === 'p1a' ? 'P1A' : 'P1大家庭';

        // Check for attachment link or thumbnail
        let attachmentHtml = '';
        const driveLink = (item.drive_links && item.drive_links[0]) ? item.drive_links[0] : null;
        if (driveLink && driveLink.thumbnail_webp) {
          attachmentHtml = `
            <div class="card-attachment" onclick="openMediaModal('${driveLink.thumbnail_webp}')">
              <img src="${driveLink.thumbnail_webp}" alt="Thumbnail" loading="lazy">
            </div>
          `;
        }

        const driveBtn = driveLink && driveLink.url ? `
          <a href="${driveLink.url}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">
            雲端預覽 ↗
          </a>
        ` : '';

        const msgIdsJson = JSON.stringify(item.msg_ids || []);

        return `
          <div class="action-card">
            <div>
              <div class="card-top">
                <div class="badges">
                  <span class="badge ${badgeClass}">${badgeText}</span>
                  <span class="badge badge-group">${groupBadge}</span>
                </div>
                <span class="card-date">${item.date || ''}</span>
              </div>
              <h3 class="card-title">${escapeHtml(item.title)}</h3>
              <p class="card-summary">${escapeHtml(item.summary)}</p>
              ${attachmentHtml}
            </div>
            <div class="card-footer">
              <button class="btn btn-primary btn-sm" onclick='openTranscript("${escapeHtml(item.title)}", ${msgIdsJson})'>
                💬 查看對話
              </button>
              ${driveBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderTopics() {
      const container = document.getElementById("topics-board");
      if (!PORTAL_DATA || !PORTAL_DATA.groups) return;

      const groups = PORTAL_DATA.groups;
      let targetGroups = [];
      if (ACTIVE_TAB === 'all') {
        targetGroups = ['p1a', 'p1_family'];
      } else {
        targetGroups = [ACTIVE_TAB];
      }

      let allTopics = [];
      for (const gKey of targetGroups) {
        const g = groups[gKey];
        if (!g || !g.topics) continue;
        for (const t of g.topics) {
          allTopics.push({ ...t, group_name: g.title, group_key: gKey });
        }
      }

      if (SEARCH_QUERY) {
        allTopics = allTopics.filter(t =>
          t.headline.toLowerCase().includes(SEARCH_QUERY) ||
          (t.bullet_points && t.bullet_points.some(b => b.toLowerCase().includes(SEARCH_QUERY)))
        );
      }

      if (allTopics.length === 0) {
        container.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--text-muted); background: var(--card-bg); border-radius: 12px; border: 1px dashed var(--border);">沒有符合篩選條件的專題討論。</div>`;
        return;
      }

      container.innerHTML = allTopics.map(t => {
        const bulletsHtml = (t.bullet_points || []).map(b => `<li>${escapeHtml(b)}</li>`).join('');
        const msgIdsJson = JSON.stringify(t.msg_ids || []);

        return `
          <div class="topic-card">
            <div class="topic-header">
              <div>
                <span class="badge badge-group" style="margin-right: 6px;">${t.group_name}</span>
                <span class="topic-title">${escapeHtml(t.headline)}</span>
              </div>
              <span class="topic-meta">${t.date_range}</span>
            </div>
            <ul class="topic-bullets">
              ${bulletsHtml}
            </ul>
            <div style="margin-top: 6px;">
              <button class="btn btn-outline btn-sm" onclick='openTranscript("${escapeHtml(t.headline)}", ${msgIdsJson})'>
                💬 展開相關對話 (${(t.msg_ids || []).length} 則訊息)
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderNoiseSummary() {
      if (!PORTAL_DATA || !PORTAL_DATA.groups) return;
      const groups = PORTAL_DATA.groups;
      let totalNoise = 0;
      let sampleIds = [];

      for (const gKey in groups) {
        const g = groups[gKey];
        if (ACTIVE_TAB !== 'all' && ACTIVE_TAB !== gKey) continue;
        if (g.noise_summary) {
          totalNoise += g.noise_summary.count || 0;
          if (g.noise_summary.sample_msg_ids) {
            sampleIds = sampleIds.concat(g.noise_summary.sample_msg_ids);
          }
        }
      }

      document.getElementById("noise-title").textContent = `🧹 已自動過濾閒聊與覆機訊息 (${totalNoise} 條)`;
      const content = document.getElementById("noise-content");

      const sampleBtn = sampleIds.length > 0 ? `
        <div style="margin-top: 10px;">
          <button class="btn btn-outline btn-sm" onclick='openTranscript("閒聊/貼圖訊息抽樣", ${JSON.stringify(sampleIds)})'>
            檢視抽樣閒聊對話 (${sampleIds.length} 則)
          </button>
        </div>
      ` : '';

      content.innerHTML = `
        <p>系統已自動識別並隔離群組中的純禮節回覆（如「收到」、「多謝老師」、「+1」）及表情貼圖。</p>
        <p style="margin-top: 4px;">本期共過濾 <strong>${totalNoise}</strong> 條訊息，節省家長大量翻查對話記錄的時間。</p>
        ${sampleBtn}
      `;
    }

    function toggleNoiseAccordion() {
      const content = document.getElementById("noise-content");
      const chevron = document.getElementById("noise-chevron");
      const isHidden = content.style.display === "none" || !content.style.display;
      content.style.display = isHidden ? "block" : "none";
      chevron.textContent = isHidden ? "▲" : "▼";
    }

    // Transcript Slide-out Drawer
    function openTranscript(title, msgIds) {
      if (!PORTAL_DATA || !PORTAL_DATA.messages_index) return;
      const index = PORTAL_DATA.messages_index;
      const drawer = document.getElementById("transcript-drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      const body = document.getElementById("drawer-body");
      const titleEl = document.getElementById("drawer-title");

      titleEl.textContent = title || "相關對話記錄";
      body.innerHTML = "";

      const foundMsgs = (msgIds || []).map(id => index[String(id)]).filter(Boolean);

      if (foundMsgs.length === 0) {
        body.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 32px;">查無對話記錄或訊息已被精簡典藏。</div>`;
      } else {
        body.innerHTML = foundMsgs.map(m => {
          let mediaHtml = '';
          if (m.thumbnail_b64) {
            mediaHtml = `
              <div class="bubble-media" onclick="openMediaModal('${m.thumbnail_b64}')">
                <img src="${m.thumbnail_b64}" alt="Thumbnail" loading="lazy">
              </div>
            `;
          }
          const driveBtn = m.drive_url ? `
            <div style="margin-top: 6px;">
              <a href="${m.drive_url}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm" style="font-size: 11px; padding: 3px 8px;">
                雲端檔案 ↗
              </a>
            </div>
          ` : '';

          return `
            <div class="chat-bubble">
              <div class="bubble-header">
                <span class="bubble-sender">${escapeHtml(m.sender)}</span>
                <span class="bubble-time">${m.date || ''}</span>
              </div>
              <div class="bubble-text">${escapeHtml(m.text || (m.has_media ? '【圖片/文件附件】' : ''))}</div>
              ${mediaHtml}
              ${driveBtn}
            </div>
          `;
        }).join('');
      }

      backdrop.style.display = "block";
      drawer.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeDrawer() {
      const drawer = document.getElementById("transcript-drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      drawer.classList.remove("open");
      backdrop.style.display = "none";
      document.body.style.overflow = "";
    }

    // Media Modal
    function openMediaModal(src) {
      const modal = document.getElementById("media-modal");
      const img = document.getElementById("modal-img");
      img.src = src;
      modal.style.display = "flex";
    }

    function closeMediaModal() {
      document.getElementById("media-modal").style.display = "none";
    }

    // Keyboard ESC listener
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeDrawer();
        closeMediaModal();
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
